<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>新芽</title>
<style>
  :root{
    --bg:#0b1220; --fg:#e8eefc; --dim:#8fa3c7; --line:rgba(255,255,255,.12);
    --me:#1f5fbf; --ai:#16233c; --warn:#ffb020;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
  }
  header{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-bottom:1px solid var(--line);background:rgba(11,18,32,.95);
    position:sticky;top:0;z-index:5;padding-top:calc(10px + env(safe-area-inset-top));
  }
  header .title{font-weight:600;flex:1}
  button{
    appearance:none;border:1px solid var(--line);background:transparent;color:inherit;
    border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;
  }
  button:active{opacity:.7}
  button.primary{background:var(--me);border-color:transparent}
  #chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:var(--me)}
  .ai{align-self:flex-start;background:var(--ai);border:1px solid var(--line)}
  .sys{align-self:center;color:var(--dim);font-size:12.5px;text-align:center;max-width:92%}
  footer{
    display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);
    padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(11,18,32,.95);
  }
  #input{
    flex:1;resize:none;height:44px;max-height:120px;border-radius:12px;padding:10px 12px;
    background:#0f1a2e;color:inherit;border:1px solid var(--line);font:inherit;
  }
  #drawer{
    position:fixed;inset:0;background:rgba(5,9,16,.96);z-index:20;overflow-y:auto;
    padding:16px;padding-top:calc(16px + env(safe-area-inset-top));
  }
  #drawer h3{margin:18px 0 8px;font-size:14px;color:var(--dim);font-weight:600}
  #drawer input,#drawer textarea{
    width:100%;background:#0f1a2e;color:inherit;border:1px solid var(--line);
    border-radius:10px;padding:10px;font:inherit;
  }
  #drawer textarea{height:110px;resize:vertical}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
  .ok{color:#57d38c}
  .bad{color:#ff7b7b}
  #bar{font-size:12px;color:var(--dim);padding:0 12px 6px}
  #btnMic.rec{border-color:#ff5b5b;color:#ff5b5b;background:rgba(255,91,91,.12)}
  footer button{flex:0 0 auto;padding:8px 10px;font-size:16px}
</style>
</head>
<body>

<header>
  <button id="btnMenu" aria-label="设置">☰</button>
  <div class="title">新芽</div>
  <button id="btnSave" title="现在存一下">存</button>
</header>
<div id="bar"></div>
<main id="chat"></main>
<footer>
  <textarea id="input" placeholder="说点什么…"></textarea>
  <button id="send" class="primary">发送</button>
</footer>

<div id="drawer" hidden>
  <div class="row" style="position:sticky;top:0;background:rgba(5,9,16,.98);padding:8px 0;z-index:2">
    <button id="btnSaveCfg" class="primary" style="flex:1">保存</button>
    <button id="btnClose">关闭</button>
  </div>
  <div class="hint">改完记得点「保存」，不点就白填了。</div>
  <div class="row"><button id="btnClear">清空对话</button></div>

  <h3>接口</h3>
  <input id="cfgBase" placeholder="https://api.deepseek.com">
  <div class="hint">模型名</div>
  <input id="cfgModel" placeholder="deepseek-flash">
  <div class="hint">API Key（只存在这台手机里，不上传）</div>
  <input id="cfgKey" type="password" placeholder="sk-…" autocomplete="off">

  <h3>联网搜索</h3>
  <label class="hint" style="display:flex;gap:8px;align-items:center">
    <input id="cfgSearch" type="checkbox" style="width:auto">
    允许它在聊天时自己搜网页（服务端工具，按次计费，约 5 元/1000 次）
  </label>
  <div class="hint">开着的时候回答会慢一点，而且这一轮不做流式（等它搜完再一起出来）。</div>

  <h3>人设（system）</h3>
  <div class="hint">这里是「你是谁」：名字、说话方式、称呼、忌讳、规矩。留空也能聊，但它就没有性格了。</div>
  <textarea id="cfgPersona" placeholder="例：你叫小满，说话简短温和，别用敬语；用户叫「老板」；不懂就说不懂，别编。"></textarea>
  <div class="row"><button id="btnPersonaFile">从文件导入</button></div>

  <h3>记忆存档</h3>
  <textarea id="cfgArchive" placeholder="放一段长期记忆（可选）：背景、偏好、正在做的事"></textarea>
  <div class="row"><button id="btnArchiveFile">从文件导入</button></div>

  <h3>交接（最近在做什么）</h3>
  <textarea id="cfgHandoff" placeholder="交接段的内容"></textarea>

  <h3>备份</h3>
  <div class="hint" id="bkInfo">还没有备份记录</div>
  <div class="row">
    <button id="btnExport">导出记忆包（.json）</button>
    <button id="btnImport">导入记忆包</button>
  </div>
  <div class="hint">备份存在手机本地；导出的文件你可以自己拷到电脑。</div>

  <h3>存一下</h3>
  <div class="hint">每天 00:00 自动存；App 打开时若发现跨天，会补做前一天的。整理日记会花一点 token。</div>
  <div class="row"><button id="btnSave2" class="primary">现在整理并备份</button></div>

  <div class="hint" style="margin-top:22px" id="verLine">v0.1.2 · 单文件网页版</div>
</div>

<input id="fPersona" type="file" accept=".md,.txt" hidden>
<input id="fArchive" type="file" accept=".md,.txt" hidden>
<input id="fBundle" type="file" accept=".json" hidden>

<script>window.__PAO_PREFILL__={};</script>
<script>
"use strict";

const VERSION = 'v1.2.0';

/* ───────── 存储 ───────── */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('pao:'+k); return v==null? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem('pao:'+k, JSON.stringify(v)) }catch(e){ toast('存不下了：'+(e.message||e)) } }
};
const cfg = Object.assign({ base:'https://api.deepseek.com', model:'deepseek-flash', key:'', search:true, tts:false }, LS.get('cfg', {}));

const PF = window.__PAO_PREFILL__ || {};
let persona = LS.get('persona', PF.persona || '');
let archive = LS.get('archive', PF.archive || '');
let handoff = LS.get('handoff', PF.handoff || '');
let autoHandoff = LS.get('autoHandoff', '');
let messages = LS.get('messages', []);          // [{role,content}]
let lastBackupDay = LS.get('lastBackupDay', '');
let backups = LS.get('backups', {});            // 'YYYY-MM-DD' -> bundle

const $ = (id)=>document.getElementById(id);
const chatEl = $('chat'), inputEl = $('input'), barEl = $('bar');


/* 轻量 markdown：先转义，再只认 **粗体** 和 `代码`，别的原样 */
function mdLite(s){
  const esc = String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

function toast(msg){
  const d = document.createElement('div');
  d.className = 'sys'; d.textContent = msg; chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  setTimeout(()=>{ d.remove() }, 4000);
}
function today(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}` }
function nowHM(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}` }

function render(){
  chatEl.innerHTML = '';
  for(const m of messages){
    const d = document.createElement('div');
    d.className = 'msg ' + (m.role === 'user' ? 'me' : 'ai');
    if(m.role === 'user') d.textContent = m.content; else d.innerHTML = mdLite(m.content);
    chatEl.appendChild(d);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
  updateBar();
}
function updateBar(){
  const n = messages.length;
  barEl.textContent = `${VERSION} · 共 ${n} 条 · 存档 ${archive.length} 字 · 最近备份 ${lastBackupDay || '无'}`;
}

/* ───────── 记忆注入 ───────── */
// 存档按关键词挑片段，别整篇塞（一轮全塞太重）
function pickArchiveSnippets(text, query, maxChars){
  if(!text) return '';
  const paras = text.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);
  if(paras.length <= 2) return text;
  const words = (query || '').toLowerCase().split(/[\s，。、？！,.\?!]+/).filter(w=>w.length >= 2);
  const scored = paras.map((p, i)=>{
    const low = p.toLowerCase();
    let s = 0;
    for(const w of words){ if(low.includes(w)) s += 2 }
    if(/^#{1,3} /.test(p)) s += 1;                 // 标题行略微加分
    return { p, s, i };
  });
  scored.sort((a,b)=> b.s - a.s || b.i - a.i);
  let out = '', used = 0;
  for(const {p} of scored){
    if(used + p.length > maxChars && out) break;
    out += p + '\n\n'; used += p.length;
  }
  return out.trim();
}

const ENV = [
  '【运行环境】你现在在手机上的一个极简聊天网页里。',
  '除了一件事：如果你开启了「联网搜索」，可以调用 deepseek_web_search 去查实时信息（新闻、价格、天气、版本号这类）。',
  '除此以外你没有工具：没有文件系统、没有终端、不能执行命令，也看不到他电脑上的文件。',
  '禁止输出 tool_use、bash、<system>、<tool> 这类标记，也不要假装去查文件或跑脚本（联网搜索除外，那是真能用的）；',
  '需要看文件内容时，只能请他把内容贴给你。不知道就直接说不知道。',
].join('');

function 本地时间文本(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  const 周 = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())} 周${周}`;
}

function buildSystem(userText){
  const parts = [ENV];
  parts.push('【现在】' + 本地时间文本() + '（手机本地时间，以这个为准，不用联网查）');
  if(persona) parts.push(persona.trim());
  if(handoff) parts.push('【最近在做什么】\n' + handoff.trim());
  if(autoHandoff) parts.push('【手机侧交接（App 自动整理，可能不准）】\n' + autoHandoff.trim());
  const todayDiary = backups[today()] && backups[today()].diary;
  if(todayDiary) parts.push('【今天的日记】\n' + todayDiary);
  const snip = pickArchiveSnippets(archive, userText, 4000);
  if(snip) parts.push('【记忆存档（相关片段）】\n' + snip);
  parts.push('【规矩】用简体中文口语，短句，别写成报告；不确定就说不确定，别编。');
  return parts.join('\n\n');
}


/* ───────── 语音输入（录音 → 16k WAV → ASR） ───────── */
function floatToWav(chunks, sr){
  const len = chunks.length;
  const buf = new ArrayBuffer(44 + len * 2);
  const v = new DataView(buf);
  const ws = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)) };
  ws(0,'RIFF'); v.setUint32(4, 36 + len * 2, true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true); ws(36,'data'); v.setUint32(40, len * 2, true);
  let o = 44;
  for (let i = 0; i < len; i++, o += 2){
    let x = Math.max(-1, Math.min(1, chunks[i]));
    v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  return new Uint8Array(buf);
}

let 录音器 = null, 录音块 = [], 录音中 = false, 原生录音 = false;

async function 开始录音(){
  // 优先用原生录音（AudioRecord）：WebView 的 getUserMedia 在不少国产 ROM 上开不了音频源
  try{
    if(window.PaoNative && window.PaoNative.startRecord){
      if(window.PaoNative.startRecord()){
        录音中 = true; 原生录音 = true;
        $('btnMic').classList.add('rec'); $('btnMic').textContent = '■';
        toast('在听了，说完再点一下');
        return;
      }
    }
  }catch(e){}
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('这台手机/浏览器不支持录音'); return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    录音块 = [];
    录音器 = new MediaRecorder(stream);
    录音器.ondataavailable = (e) => { if(e.data && e.data.size) 录音块.push(e.data) };
    录音器.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      await 处理录音();
    };
    录音器.start();
    录音中 = true;
    $('btnMic').classList.add('rec');
    $('btnMic').textContent = '■';
    toast('在听了，说完再点一下');
  }catch(e){
    const m = String((e && e.message) || e);
    if(/NotAllowed|Permission/i.test(m)) toast('麦克风权限被拒了：去手机设置里给 App 开麦克风');
    else if(/Could not start audio source|NotReadable/i.test(m)) toast('麦克风被别的 App 占着（或系统限制），关掉别的录音软件再试');
    else toast('开不了麦克风：' + m);
  }
}

function 停止录音(){
  录音中 = false;
  $('btnMic').classList.remove('rec');
  $('btnMic').textContent = '🎤';
  if(原生录音){
    原生录音 = false;
    let b64 = '';
    try{ b64 = window.PaoNative.stopRecord() || '' }catch(e){}
    if(!b64){ toast('没录到声音'); return }
    上传WavBase64(b64);
    return;
  }
  if(录音器 && 录音器.state !== 'inactive') 录音器.stop();
}

async function 上传WavBase64(b64){
  if(!cfg.key){ toast('先填 API Key'); openDrawer(); return }
  toast('转文字中…');
  try{
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const fd = new FormData();
    fd.append('file', new Blob([bytes], { type:'audio/wav' }), 'speech.wav');
    const res = await fetch(cfg.base.replace(/\/$/,'') + '/v1/tools/asr', {
      method:'POST', headers:{ 'Authorization':'Bearer ' + cfg.key }, body: fd,
    });
    const j = await res.json().catch(()=>({}));
    if(!res.ok || !j.text){ toast('转写失败：' + (j.error ? (j.error.message||'') : ('HTTP ' + res.status))); return }
    inputEl.value = (inputEl.value ? inputEl.value + ' ' : '') + j.text;
    toast('转好了');
  }catch(e){ toast('转写出错：' + (e.message || e)) }
}

async function 处理录音(){
  if(!录音块.length){ toast('没录到声音'); return }
  if(!cfg.key){ toast('先填 API Key'); openDrawer(); return }
  toast('转文字中…');
  try{
    const blob = new Blob(录音块, { type: 录音块[0].type || 'audio/webm' });
    const ab = await blob.arrayBuffer();
    // 解到 16k 单声道，再封成 WAV（ASR 只认 WAV / Ogg Opus）
    const ctx = new OfflineAudioContext(1, 16000, 16000);
    const audio = await ctx.decodeAudioData(ab);
    const data = audio.getChannelData(0);
    const wav = floatToWav(data, 16000);
    const fd = new FormData();
    fd.append('file', new Blob([wav], { type:'audio/wav' }), 'speech.wav');
    const res = await fetch(cfg.base.replace(/\/$/,'') + '/v1/tools/asr', {
      method:'POST', headers:{ 'Authorization':'Bearer ' + cfg.key }, body: fd,
    });
    const j = await res.json().catch(()=>({}));
    if(!res.ok || !j.text){ toast('转写失败：' + (j.error ? (j.error.message||'') : ('HTTP ' + res.status))); return }
    inputEl.value = (inputEl.value ? inputEl.value + ' ' : '') + j.text;
    toast('转好了');
  }catch(e){
    toast('转写出错：' + (e.message || e));
  }
}

/* ───────── 朗读 ───────── */
let 正在播 = null;
async function 念这一段(text){
  const plain = String(text || '').replace(/[*`#>]/g, '').trim();
  if(!plain) return;
  if(!cfg.key){ toast('先填 API Key 才能念'); return }
  try{
    if(正在播){ 正在播.pause(); 正在播 = null }
    toast('合成语音中…');
    const res = await fetch(cfg.base.replace(/\/$/,'') + '/v1/tools/tts', {
      method:'POST',
      headers:{ 'Authorization':'Bearer ' + cfg.key, 'Content-Type':'application/json' },
      body: JSON.stringify({ text: plain.slice(0, 800), voice_id: 'stella', format: 'wav', filter_markdown: true }),
    });
    if(!res.ok){ toast('朗读失败：HTTP ' + res.status); return }
    const buf = await res.arrayBuffer();
    if(!buf.byteLength){ toast('朗读失败：空音频'); return }
    const url = URL.createObjectURL(new Blob([buf], { type:'audio/wav' }));
    正在播 = new Audio(url);
    正在播.onended = () => { URL.revokeObjectURL(url); 正在播 = null };
    await 正在播.play();
  }catch(e){
    toast('朗读出错：' + (e.message || e));
  }
}

/* 从别的 App 分享进来 */
window.__paoShared = (text) => {
  inputEl.value = String(text || '').trim();
  toast('分享的内容放进输入框了');
};

/* ───────── 聊天 ───────── */
let sending = false;

async function send(){
  if(sending) return;
  const text = inputEl.value.trim();
  if(!text) return;
  if(!cfg.key){ toast('先去设置里填 API Key'); openDrawer(); return }

  inputEl.value = '';
  messages.push({ role:'user', content:text });
  LS.set('messages', messages);
  render();

  const aiEl = document.createElement('div');
  aiEl.className = 'msg ai'; aiEl.textContent = '…';
  chatEl.appendChild(aiEl); chatEl.scrollTop = chatEl.scrollHeight;

  sending = true;
  let acc = '';
  // 空等提示：先「思考中」，久了升级成「深度思考中」，联网时先说「正在搜」
  const t0 = Date.now();
  const 提示计时 = setInterval(() => {
    if(acc) { clearInterval(提示计时); return }
    const sec = Math.round((Date.now() - t0) / 1000);
    const base = cfg.search
      ? '正在联网搜索'
      : (sec >= 6 ? '正在努力想' : '思考中');
    aiEl.textContent = base + '…' + (sec >= 3 ? ` ${sec}s` : '');
  }, 500);
  try{
    const useSearch = Boolean(cfg.search);
    const body = {
      model: cfg.model,
      stream: !useSearch,
      messages: [{ role:'system', content: buildSystem(text) }, ...messages.slice(-20)],
    };
    if(useSearch){
      body.tools = [{ type:'deepseek_web_search', name:'deepseek_web_search' }];
    }
    const res = await fetch(cfg.base.replace(/\/$/,'') + '/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key },
      body: JSON.stringify(body),
    });
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error(`HTTP ${res.status} ${t.slice(0,200)}`);
    }
    if(useSearch){
      // 联网这一轮走非流式：等它搜完、读完，再一次性显示
      const j = await res.json();
      const m = (j.choices && j.choices[0] && j.choices[0].message) || {};
      acc = String(m.content || '').trim();
      // 不给来源清单：他没问就别画蛇添足；正文里的链接照常显示
      aiEl.innerHTML = mdLite(acc || '（搜了，但没搜到什么）');
    } else {
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });
      let idx;
      while((idx = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx+1);
        if(!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if(data === '[DONE]') continue;
        try{
          const j = JSON.parse(data);
          const d = j.choices && j.choices[0] && j.choices[0].delta;
          if(d && d.reasoning_content && !acc){
            aiEl.textContent = '正在努力想…';
          }
          if(d && typeof d.content === 'string' && d.content){
            acc += d.content;
            aiEl.innerHTML = mdLite(acc);
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        }catch(e){ /* 半截 JSON 忽略 */ }
      }
    }
    }
    if(!acc){
      // 只有思考、没有正文 —— 和 Windows 那个 bug 同一类
      aiEl.textContent = '（只有思考，没有正文）试试降低思考强度或换个问题';
    }else if(/tool_use|<system>|<\/system>|\bbash\b\s*\{/.test(acc) && acc.length < 400){
      aiEl.textContent = '（它在假装跑工具，我已经把这段拦下了）这里是手机版，没有工具权限；要看文件就把内容贴给我。';
    }else{
      messages.push({ role:'assistant', content:acc });
      LS.set('messages', messages);
      if(cfg.tts) 念这一段(acc);
    }
  }catch(e){
    aiEl.textContent = '出错：' + (e.message || e);
  }finally{
    clearInterval(提示计时);
    sending = false; updateBar();
  }
}

/* ───────── 每天整理 + 备份 ───────── */
async function makeDiaryAndHandoff(){
  const todayMsg = messages.filter(m=> m.role === 'user' || m.role === 'assistant');
  if(todayMsg.length < 2) return { diary:'', handoff:'' };
  const convo = messages.slice(-40).map(m=> (m.role==='user'?'我：':'它：') + m.content).join('\n').slice(-12000);
  const prompt = '下面是我和泡聊天记录（节选）。请做两件事，用固定格式回答，别加解释。\n' +
    '硬要求：不要角色扮演，不要写氛围描写；每条都写成干练的事实句。\n' +
    '1) 写今天的日记：照实际发生的事写，别编，200 字以内，第一人称“我”。\n' +
    '2) 写交接：3~5 条，说明手上在做什么、下一步是什么。\n\n' +
    '格式：\n===日记===\n...\n===交接===\n...\n\n对话：\n' + convo;
  try{
    const res = await fetch(cfg.base.replace(/\/$/,'') + '/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key },
      body: JSON.stringify({ model: cfg.model, temperature: 0.3,
        messages: [{ role:'user', content: prompt }] }),
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    const md = /===日记===([\s\S]*?)(?:===交接===|$)/.exec(txt);
    const mh = /===交接===([\s\S]*)$/.exec(txt);
    return { diary: md ? md[1].trim() : '', handoff: mh ? mh[1].trim() : '' };
  }catch(e){
    return { diary:'', handoff:'', error: String(e.message||e) };
  }
}

async function doBackup(day){
  const d = day || today();
  let { diary, handoff: hf } = backups[d] || {};
  if(!diary && cfg.key){
    const got = await makeDiaryAndHandoff();
    diary = got.diary; hf = got.handoff || hf;
    if(hf) { autoHandoff = hf; LS.set('autoHandoff', autoHandoff) }
  }
  const bundle = {
    v: 1, day: d, savedAt: new Date().toISOString(),
    persona, archive, handoff, autoHandoff,
    diary: diary || '',
    messages: messages.slice(-60),
  };
  backups[d] = bundle;
  // 只留最近 7 天
  const days = Object.keys(backups).sort();
  while(days.length > 7){ delete backups[days.shift()] }
  LS.set('backups', backups);
  lastBackupDay = d; LS.set('lastBackupDay', lastBackupDay);
  updateBar(); refreshBkInfo();
  toast(`已存 ${d} 的备份${diary ? '（含日记）' : ''}`);
}

function exportBundle(){
  const blob = new Blob([JSON.stringify({ v:1, exportedAt:new Date().toISOString(), persona, archive, handoff, backups, messages }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `新芽记忆包-${today()}.json`;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 3000);
}
function importBundle(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const j = JSON.parse(String(fr.result));
      if(j.persona != null) { persona = j.persona; LS.set('persona', persona) }
      if(j.archive != null) { archive = j.archive; LS.set('archive', archive) }
      if(j.handoff != null) { handoff = j.handoff; LS.set('handoff', handoff) }
      if(j.autoHandoff != null) { autoHandoff = j.autoHandoff; LS.set('autoHandoff', autoHandoff) }
      if(j.backups) { backups = j.backups; LS.set('backups', backups) }
      if(Array.isArray(j.messages)) { messages = j.messages; LS.set('messages', messages) }
      fillDrawer(); render(); refreshBkInfo();
      toast('导进来了');
    }catch(e){ toast('导入失败：' + (e.message||e)) }
  };
  fr.readAsText(file);
}

/* ───────── 零点与补做 ───────── */
let lastTickDay = today();
function tick(){
  const d = today();
  if(d !== lastTickDay){
    // 跨天了：先补昨天，再开始新的一天
    const prev = lastTickDay;
    lastTickDay = d;
    doBackup(prev);
  }
  const hm = nowHM();
  if(hm === '00:00' && lastBackupDay !== d){
    doBackup(d);
  }
  // 打开时若发现昨天没存 → 补
  if(lastBackupDay && lastBackupDay !== d){
    const missed = lastTickDay;
    if(missed !== lastBackupDay) doBackup(lastBackupDay);
  }
}
setInterval(tick, 30000);

/* ───────── 设置面板 ───────── */
function fillDrawer(){
  $('cfgBase').value = cfg.base;
  $('cfgModel').value = cfg.model;
  $('cfgKey').value = cfg.key;
  $('cfgSearch').checked = Boolean(cfg.search);
  if($('cfgTts')) $('cfgTts').checked = Boolean(cfg.tts);
  $('cfgPersona').value = persona;
  $('cfgArchive').value = archive;
  $('cfgHandoff').value = handoff;
}
function refreshBkInfo(){
  const days = Object.keys(backups).sort();
  $('bkInfo').textContent = days.length
    ? `共 ${days.length} 天：${days.join('、')}`
    : '还没有备份记录';
}
function openDrawer(){ fillDrawer(); refreshBkInfo(); $('drawer').hidden = false }
function closeDrawer(){
  cfg.base = $('cfgBase').value.trim() || 'https://api.deepseek.com';
  cfg.model = $('cfgModel').value.trim() || 'deepseek-flash';
  cfg.key = $('cfgKey').value.trim();
  cfg.search = Boolean($('cfgSearch').checked);
  cfg.tts = $('cfgTts') ? Boolean($('cfgTts').checked) : false;
  persona = $('cfgPersona').value;
  archive = $('cfgArchive').value;
  handoff = $('cfgHandoff').value;
  LS.set('cfg', cfg); LS.set('persona', persona); LS.set('archive', archive); LS.set('handoff', handoff);
  $('drawer').hidden = true; updateBar();
}

$('btnMenu').onclick = openDrawer;
$('btnSaveCfg').onclick = ()=>{ closeDrawer(); toast('保存好了'); };
$('btnClose').onclick = closeDrawer;
$('btnSave').onclick = ()=> doBackup(today());
$('btnSave2').onclick = async ()=>{ toast('整理中…'); await doBackup(today()); };
$('btnClear').onclick = ()=>{ if(confirm('清空这次对话？（备份不动）')){ messages=[]; LS.set('messages', messages); render() } };
$('send').onclick = send;
if($('btnMic')) $('btnMic').onclick = () => { 录音中 ? 停止录音() : 开始录音() };
if($('btnSpeak')) $('btnSpeak').onclick = () => {
  const last = [...messages].reverse().find(m => m.role === 'assistant');
  if(last) 念这一段(last.content); else toast('还没有回答可以念');
};
inputEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send() } });
inputEl.addEventListener('input', ()=>{ inputEl.style.height='44px'; inputEl.style.height=Math.min(120, inputEl.scrollHeight)+'px' });

$('btnPersonaFile').onclick = ()=> $('fPersona').click();
$('btnArchiveFile').onclick = ()=> $('fArchive').click();
$('btnExport').onclick = exportBundle;
$('btnImport').onclick = ()=> $('fBundle').click();
$('fPersona').onchange = (e)=> readInto(e, 'cfgPersona');
$('fArchive').onchange = (e)=> readInto(e, 'cfgArchive');
$('fBundle').onchange = (e)=> { const f = e.target.files[0]; if(f) importBundle(f) };

function readInto(ev, targetId){
  const f = ev.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{ $(targetId).value = String(fr.result).slice(0, 200000); toast('导入好了') };
  fr.readAsText(f);
}

/* ───────── 启动 ───────── */
fillDrawer(); render(); refreshBkInfo();
$('verLine').textContent = VERSION + ' · 新芽';
if(!cfg.key) setTimeout(openDrawer, 300);
if(cfg.key && !persona) toast('还没写人设：点左上 ☰ 写一段「你是谁」');
// 打开时补一次：昨天没存就补
if(lastBackupDay && lastBackupDay !== today()){
  setTimeout(()=> doBackup(lastBackupDay), 1500);
}
</script>
