name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备好 Android SDK
        run: |
          set -x
          SDK_BIN="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)"
          yes | "$SDK_BIN" --licenses > /dev/null 2>&1 || true
          "$SDK_BIN" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | "$SDK_BIN" --licenses > /dev/null 2>&1 || true

      - name: 装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 打包
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

      - name: 挂到 Releases（公开可下，不用登录）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 新芽 最新构建
          body: 自动构建，每次推送都覆盖这一版。
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: true
