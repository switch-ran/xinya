name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备好 Android SDK
        run: |
          set -x
          SDK_BIN="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)"
          yes | "$SDK_BIN" --licenses > /dev/null 2>&1 || true
          "$SDK_BIN" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | "$SDK_BIN" --licenses > /dev/null 2>&1 || true

      - name: 装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 打包
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
